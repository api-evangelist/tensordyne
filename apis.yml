name: Tensordyne
description: >-
  Tensordyne (formerly Recogni) builds next-generation AI inference systems from
  the foundation up — a proprietary logarithmic-math architecture cast into custom
  3nm silicon, compute hardware, scale-up interconnect, and system software. Its
  flagship Napier platform targets the fastest, lowest-cost, most energy-efficient
  generative AI inference for hyperscaler and neocloud data centers, delivering
  608 PFLOPS dense compute per rack in an air-cooled 30 kW pod and supporting MoE
  models, agentic workloads, and 4K video generation. The stack integrates with
  PyTorch, Triton, vLLM, and Kubernetes; a developer SDK is announced as coming
  soon. Backed by Mayfield, Bosch Ventures, Toyota Ventures, GreatPoint Ventures,
  and Plug and Play, the company has raised more than $211M and operates from
  Sunnyvale, California and Munich, Germany.
